# 虚构商赛案例：苏州零售消费品类 · 社区优选新品牌「苏里优选」
# 所有数字均为演示假设，不代表真实市场统计。

[meta]
title = "苏里优选 · 苏州社区零售扩张案"
city = "苏州"
category = "社区零售 / 生鲜日用"
brand = "苏里优选"
year = 2026
disclaimer = "演示案例数据虚构；商赛简介与贡献对齐公开赛制与个人履历"

# ---------- 0. 商赛简介 · 架构映射 · 贡献 ----------
# 依据全国高校商业精英挑战赛品牌策划赛道公开细则（SOP）整理，非官方文档全文。
[competition]
series = "全国高校商业精英挑战赛"
track = "品牌策划赛道"
organizer = "中国贸促会商业行业委员会等"
mode = "企业出题—院校答题—行业判卷；真实品牌须企业书面授权"
team = "3–5 名选手 + 1–2 名指导教师"
award = "全国三等奖"
real_case = "宋锦品牌（真实参赛）"
demo_case = "苏里优选 · 苏州社区零售（本仓虚构演示）"
role = "数据分析与量化建模"
platform = "https://ssyth.cubec.org.cn/"
note = "官方策划书要素：现状分析 → 定位与核心价值 → 元素设计 → 推广传播 → 资产保护与风险 → 财务预算。本仓把可计算部分工具化，不替代完整策划书 PDF。"

[[competition.sop_stages]]
name = "知识赛"
desc = "品牌基础理论在线测评，满 100、≥60 分获组队资格"

[[competition.sop_stages]]
name = "校赛"
desc = "院校自组织选拔；推选比例有上限后晋级"

[[competition.sop_stages]]
name = "省赛 / 全国预选赛"
desc = "评审策划书（预选）或策划书 + 答辩（省赛）"

[[competition.sop_stages]]
name = "全国总决赛"
desc = "策划书 + 视频展示 + 实时答辩；评全国一/二/三等奖"

[[competition.sop_stages]]
name = "精英赛 / 全球赛"
desc = "优秀队晋级路演或全球青年商业挑战赛选拔"

[[competition.plan_mapping]]
chapter = "品牌现状分析（环境 / 竞品）"
lab = "市场测算 TAM/SAM/SOM · 波特五力 · 竞品雷达"
score_hint = "书面案「现状分析准确性」"

[[competition.plan_mapping]]
chapter = "定位与目标市场"
lab = "可服务地理 × 三年份额 SOM · 情景推演"
score_hint = "书面案「定位正确性」"

[[competition.plan_mapping]]
chapter = "推广传播可行性"
lab = "竞品促销告警 · 商业监控（CAC / NPS / 份额）"
score_hint = "书面案「推广与传播可行性」"

[[competition.plan_mapping]]
chapter = "财务预算与风险"
lab = "单位经济 · 回本月数 · 悲观情景纪律"
score_hint = "书面案「财务预算合理性」+ 风险管理"

[[competition.scoring]]
part = "书面策划案"
weight = "60 分"
items = "现状分析 / 定位 / 元素创意 / 推广可行性 / 资产与风险 / 财务预算（各约 10 分）"

[[competition.scoring]]
part = "展示与答辩"
weight = "40 分"
items = "视频 / 现场陈述逻辑、数据可信度、临场问答（总决赛）"

[[competition.contributions]]
title = "行业结构量化"
detail = "PEST + 波特五力：把宏观与五力强度落到可辩护的驱动因素，而不是口号式「竞争激烈」"

[[competition.contributions]]
title = "传播路径双模型"
detail = "SPSS：LDA 主题挖掘 + SEM 路径，量化品牌传播关键节点与影响系数"

[[competition.contributions]]
title = "策划书可计算章节"
detail = "负责现状分析 / 竞争结构 / 财务与风险相关测算口径，支撑全国三等奖（宋锦）书面案与答辩数据"

[[competition.contributions]]
title = "本仓开源沉淀"
detail = "把可复用的测算、五力、监控做成标准库工具；演示行业换苏州零售，与真实 BP 隔离"

# ---------- 1. 市场测算假设 ----------
[market]
# 苏州常住人口（演示用数量级）
population = 12_900_000
# 家庭户规模
household_size = 2.6
# 家庭食品日用月支出（元）
monthly_spend_per_hh = 1800
# 可线上/社区店渗透的品类占比
addressable_share = 0.35
# 社区优选赛道占可触达支出比例
segment_share = 0.12
# 我方可服务区域（古城区+工业园区+高新区核心）人口占比
serviceable_geo = 0.28
# 三年目标份额（SOM）
target_share_y3 = 0.08
# 年化消费月数
months = 12

# ---------- 2. 竞品快照（虚构） ----------
[[competitors]]
name = "邻里优选"
price_index = 100
sku = 3200
nps = 42
share = 0.22
promo_intensity = 0.35
note = "老牌社区团购转型"

[[competitors]]
name = "城南大卖场"
price_index = 92
sku = 8000
nps = 28
share = 0.31
promo_intensity = 0.22
note = "大店低价，履约慢"

[[competitors]]
name = "湖畔便利联盟"
price_index = 108
sku = 1500
nps = 51
share = 0.11
promo_intensity = 0.18
note = "便利店加盟，密度高"

[[competitors]]
name = "苏里优选"
price_index = 103
sku = 2100
nps = 47
share = 0.04
promo_intensity = 0.28
note = "本品牌 · 新鲜度与私域"

# 告警规则阈值
[compete_rules]
price_undercut_vs_us = 8          # 竞品价格指数低于我方超过该点 → 跟价预警
nps_lead_vs_us = 8               # 竞品 NPS 高于我方超过该点 → 体验差距
share_floor = 0.05              # 我方份额低于该值 → 份额告警
promo_spike = 0.30              # 促销强度高于该值 → 促销战告警

# ---------- 3. 单位经济（单均订单） ----------
[unit]
aov = 68.0                      # 客单价
gross_margin = 0.28             # 毛利率
cac = 22.0                      # 获客成本（首单归因）
fulfill_cost = 9.5              # 履约/包装
take_rate_other = 0.03          # 支付与损耗等
orders_per_month = 3.2          # 月复购次数（成熟用户）
months_to_payback_cap = 18

# ---------- 4. 情景推演 ----------
[scenarios.base]
label = "基准"
demand_mult = 1.0
cac_mult = 1.0
margin_delta = 0.0
share_y3 = 0.08

[scenarios.upside]
label = "乐观"
demand_mult = 1.25
cac_mult = 0.85
margin_delta = 0.02
share_y3 = 0.12

[scenarios.downside]
label = "悲观"
demand_mult = 0.75
cac_mult = 1.25
margin_delta = -0.03
share_y3 = 0.04

# ---------- 5. 波特五力（1–5，越高压力越大） ----------
[porter.rivalry]
intensity = 4
drivers = "邻里优选 / 大卖场 / 便利联盟同城多点布局，促销频繁，份额分散"
implication = "差异化走新鲜度与私域，核心 SKU 跟价、非核心守毛利"

[porter.new_entrants]
intensity = 3
drivers = "社区团购/前置仓进入门槛中等；履约站与地推仍需资本与密度"
implication = "用可服务地理密度与会员复购抬高进入成本"

[porter.substitutes]
intensity = 4
drivers = "大卖场到店、外卖即时零售、超市 Mini 店均可替代「社区订购」"
implication = "强调 2 小时履约与生鲜品质，弱化纯比价心智"

[porter.buyer_power]
intensity = 4
drivers = "家庭用户切换成本低，价格敏感，促销对比工具多"
implication = "会员日与组合装提高粘性，避免无差别补贴"

[porter.supplier_power]
intensity = 3
drivers = "生鲜产地与区域经销商集中度中等；SKU 越多议价越难"
implication = "头部 SKU 集采压价，长尾用联营降库存风险"

# ---------- 6. 商业监控 ----------
[monitor]
as_of = "2026-W41"
rhythm = "日度：价格/促销巡检；周度：份额·UE·NPS 复盘；红灯当日给动作"
default_cadence = "周"

[[monitor.kpis]]
key = "share"
name = "核心区份额"
kind = "pct"
target = 0.05
wow_delta = -0.003
warn_below = 0.05
crit_below = 0.035
owner = "增长"
cadence = "周"
action = "加密履约站 + 老客券，不做全网低价"

[[monitor.kpis]]
key = "price_index"
name = "我方价格指数"
kind = "index"
target = 100
wow_delta = 1.0
warn_above = 105
crit_above = 110
owner = "商品"
cadence = "日"
action = "核心 SKU 跟价观察；非核心组合装守毛利"

[[monitor.kpis]]
key = "nps"
name = "NPS"
kind = "index"
target = 50
wow_delta = -1.0
warn_below = 45
crit_below = 40
owner = "体验"
cadence = "周"
action = "拆差评 Top3，对齐 VOC 复盘"

[[monitor.kpis]]
key = "gross_margin"
name = "毛利率"
kind = "pct"
target = 0.28
wow_delta = -0.005
warn_below = 0.25
crit_below = 0.22
owner = "商品"
cadence = "周"
action = "砍低效促销，抬高高毛利组合占比"

[[monitor.kpis]]
key = "cac"
name = "CAC"
kind = "yuan"
target = 20
wow_delta = 2.0
warn_above = 25
crit_above = 35
owner = "增长"
cadence = "周"
action = "停无效渠道，预算转向复购与会员"

[[monitor.kpis]]
key = "contribution"
name = "单均贡献"
kind = "yuan"
target = 8
wow_delta = -0.4
warn_below = 6
crit_below = 3
owner = "经营"
cadence = "周"
action = "先修履约成本与损耗，再谈放量"

[[monitor.kpis]]
key = "payback_months"
name = "回本月数"
kind = "months"
target = 6
wow_delta = 0.3
warn_above = 12
crit_above = 18
owner = "经营"
cadence = "月"
action = "超 cap 则收缩地理与补贴"
